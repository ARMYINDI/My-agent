<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>My Agent</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#30363d;--tx:#e6edf3;--mut:#8b949e;--acc:#2f81f7;--ok:#3fb950;--bad:#f85149;--warn:#d29922}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
  header b{flex:1;font-size:18px}
  .chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
  .chip.on{color:var(--ok);border-color:var(--ok)}
  .chip.off{color:var(--bad);border-color:var(--bad)}
  button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
  button.p{background:var(--acc);border-color:var(--acc);color:#fff}
  button:disabled{opacity:.5}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
  .user{align-self:flex-end;background:var(--acc);color:#fff}
  .bot{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
  .tool{align-self:flex-start;font-size:13px;color:var(--mut);background:transparent;border:1px dashed var(--line)}
  .err{align-self:flex-start;color:var(--bad);border:1px solid var(--bad)}
  form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom))}
  textarea{flex:1;resize:none;max-height:120px;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;width:min(94vw,440px);max-height:92vh;overflow:auto;padding:18px}
  dialog::backdrop{background:#000a}
  label{display:block;margin:12px 0 4px;color:var(--mut);font-size:14px}
  input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
  .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  small{color:var(--mut);display:block;margin-top:6px}
  hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  #prog{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:8px;display:none}
  #bar{height:100%;width:0;background:var(--ok)}
</style>
</head>
<body>
<header>
  <b>My Agent</b>
  <span id="mode" class="chip"></span>
  <span id="net" class="chip"></span>
  <button id="setBtn" type="button" aria-label="Settings">⚙</button>
</header>

<main id="chat"></main>

<form id="f">
  <textarea id="inp" rows="1" placeholder="Kuch likho... (jaise: 25*4 kitna hota hai?)"></textarea>
  <button id="send" class="p">Bhejo</button>
</form>

<dialog id="dlg">
  <b>Settings</b>

  <label for="mode2">Mode</label>
  <select id="mode2">
    <option value="auto">Auto (internet ho to online, warna offline)</option>
    <option value="online">Sirf online (Gemini)</option>
    <option value="offline">Sirf offline (phone ka model)</option>
  </select>

  <label for="key">Gemini API key</label>
  <input id="key" type="password" autocomplete="off" placeholder="AIza...">
  <label for="model">Gemini model</label>
  <input id="model" type="text">
  <small>Ye model band/busy ho to app khud dusre model try karta hai.</small>

  <hr>
  <b>Offline model</b>
  <small id="offState"></small>
  <label for="repo">HuggingFace repo</label>
  <input id="repo" type="text">
  <label for="file">File</label>
  <input id="file" type="text">
  <div id="prog"><div id="bar"></div></div>
  <small id="progTxt"></small>
  <div class="row">
    <button id="dl" type="button">Offline model download (WiFi par)</button>
  </div>

  <div class="row">
    <button id="clearChat" type="button">Chat saaf</button>
    <button id="saveBtn" type="button" class="p">Save</button>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

const DEF = {
  model: 'gemini-3.5-flash-lite',
  fallbacks: ['gemini-3.5-flash-lite', 'gemini-flash-latest'],
  repo: 'Qwen/Qwen2.5-0.5B-Instruct-GGUF',
  file: 'qwen2.5-0.5b-instruct-q4_k_m.gguf',
  lib: 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.8.1/esm/'
};

const SYS = "You are a helpful personal assistant running on the user's phone. " +
  "Reply in the same language the user writes in (Hindi/Hinglish/English), short and simple. " +
  "Use the tools when the user wants to save or read notes, do math, or know the time.";

/* ---------- Tools (dono modes mein same) ---------- */
function notes(){ try{ return JSON.parse(store.get('notes', '[]')); }catch(e){ return []; } }
const tools = {
  note_add: ({text}) => {
    const n = notes(); n.push({t: new Date().toISOString(), text: String(text)});
    store.set('notes', JSON.stringify(n)); return 'saved. total notes: ' + n.length;
  },
  note_list: () => {
    const n = notes(); return n.length ? n.map((x, i) => (i + 1) + '. ' + x.text).join('\n') : 'no notes yet';
  },
  calculator: ({expression}) => {
    const e = String(expression);
    if(!/^[0-9+\-*/().%\s^]+$/.test(e)) return 'error: only numbers and + - * / ( ) % ^ allowed';
    try{ return String(Function('"use strict";return (' + e.replace(/\^/g, '**') + ')')()); }
    catch(x){ return 'error: bad expression'; }
  },
  get_time: () => new Date().toLocaleString('en-IN', {timeZone: 'Asia/Kolkata'})
};
function runTool(name, args){
  try{ return tools[name] ? tools[name](args || {}) : 'unknown tool'; }
  catch(e){ return 'error: ' + e.message; }
}
const decl = [
  {name:'note_add', description:'Save a note for the user', parameters:{type:'OBJECT', properties:{text:{type:'STRING', description:'note text'}}, required:['text']}},
  {name:'note_list', description:'List all saved notes'},
  {name:'calculator', description:'Evaluate a math expression', parameters:{type:'OBJECT', properties:{expression:{type:'STRING', description:'e.g. 25*4+3'}}, required:['expression']}},
  {name:'get_time', description:'Get the current date and time in India'}
];

/* ---------- UI helpers ---------- */
function add(cls, text){
  const d = document.createElement('div');
  d.className = 'm ' + cls; d.textContent = text;
  $('#chat').appendChild(d); d.scrollIntoView({block:'end'});
  return d;
}
function chips(){
  const n = $('#net'), on = navigator.onLine;
  n.textContent = on ? 'online' : 'offline';
  n.className = 'chip ' + (on ? 'on' : 'off');
  const m = store.get('mode', 'auto');
  $('#mode').textContent = m === 'auto' ? 'auto' : (m === 'online' ? 'sirf online' : 'sirf offline');
}
addEventListener('online', chips); addEventListener('offline', chips); chips();

/* ---------- Online brain: Gemini (auto fallback) ---------- */
let history = [];
function netErr(e){ e.net = true; return e; }

async function geminiOnce(model, key){
  let r;
  try{
    r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'x-goog-api-key': key},
      body: JSON.stringify({systemInstruction:{parts:[{text:SYS}]}, contents: history, tools:[{functionDeclarations: decl}]})
    });
  }catch(e){ throw netErr(new Error('Internet/network error')); }
  const j = await r.json().catch(() => ({}));
  if(!r.ok){
    const err = new Error((j.error && j.error.message) || ('HTTP ' + r.status));
    err.status = r.status; throw err;
  }
  const c = j.candidates && j.candidates[0];
  if(!c || !c.content) throw new Error('Khali jawab aaya (shayad safety filter).');
  return c.content;
}
function retryable(e){
  return e.status === 404 || e.status === 429 || e.status >= 500 ||
    /no longer available|high demand|not found|overloaded|unavailable/i.test(e.message);
}
async function gemini(){
  const key = store.get('key', '');
  if(!key) throw new Error('Pehle ⚙ mein Gemini API key daalo.');
  const pref = store.get('model', DEF.model);
  const list = [...new Set([pref, ...DEF.fallbacks])];
  let last;
  for(let round = 0; round < 2; round++){
    for(const m of list){
      try{
        const c = await geminiOnce(m, key);
        if(m !== pref) add('tool', 'ℹ️ ' + pref + ' busy tha, ' + m + ' se jawab aaya');
        return c;
      }catch(e){
        last = e;
        if(e.net || !retryable(e)) throw e;
      }
    }
    await new Promise(r => setTimeout(r, 2000));
  }
  throw last;
}

async function onlineAgent(text){
  const start = history.length;
  history.push({role:'user', parts:[{text}]});
  try{
    for(let i = 0; i < 5; i++){
      const c = await gemini();
      history.push(c);
      const parts = c.parts || [];
      const calls = parts.filter(p => p.functionCall);
      if(!calls.length) return parts.map(p => p.text || '').join('').trim() || '(khali jawab)';
      const results = calls.map(p => {
        const f = p.functionCall, out = runTool(f.name, f.args);
        add('tool', '🔧 ' + f.name + ' → ' + out);
        return {functionResponse:{name: f.name, response:{result: out}}};
      });
      history.push({role:'user', parts: results});
    }
    return 'Bahut zyada steps ho gaye, isliye ruk gaya.';
  }catch(e){ history.length = start; throw e; }
}

/* ---------- Offline brain: wllama (phone ke andar) ---------- */
let wl = null, wlLoading = null;
const OFF_SYS = "You are a short, helpful phone assistant. Reply in the user's language.\n" +
  "Tools you can use:\n" +
  '- note_add {"text":"..."}  saves a note\n' +
  '- note_list {}  lists notes\n' +
  '- calculator {"expression":"25*4"}  does math\n' +
  '- get_time {}  current time\n' +
  'If you need a tool, reply with ONLY one JSON object like {"tool":"calculator","args":{"expression":"25*4"}} and nothing else. ' +
  'Otherwise reply with plain short text.';

async function loadOffline(onProgress){
  if(wl) return wl;
  if(wlLoading) return wlLoading;
  wlLoading = (async () => {
    const lib = await import(DEF.lib + 'index.js');
    const cdn = await import(DEF.lib + 'wasm-from-cdn.js');
    const w = new lib.Wllama(cdn.default);
    await w.loadModelFromHF(
      {repo: store.get('repo', DEF.repo), file: store.get('file', DEF.file)},
      {progressCallback: ({loaded, total}) => { if(onProgress) onProgress(loaded, total); }, n_ctx: 2048, allowOffline: true}
    );
    wl = w; store.set('offlineReady', '1');
    return w;
  })();
  try{ return await wlLoading; }
  finally{ wlLoading = null; }
}

function parseTool(text){
  const m = String(text).match(/\{[\s\S]*\}/);
  if(!m) return null;
  try{ const o = JSON.parse(m[0]); return (o && typeof o.tool === 'string') ? o : null; }
  catch(e){ return null; }
}

let offHist = [];
async function offlineAgent(text){
  if(!store.get('offlineReady', '') && !wl)
    throw new Error('Offline model abhi download nahi hua. WiFi par ⚙ → "Offline model download" dabao.');
  const note = add('tool', '... offline model load ho raha hai (pehli baar der lagti hai)');
  let w;
  try{ w = await loadOffline(); }finally{ note.remove(); }
  const msgs = [{role:'system', content: OFF_SYS}, ...offHist.slice(-6), {role:'user', content: text}];
  const wait = add('tool', '... soch raha hoon (offline)');
  try{
    for(let i = 0; i < 3; i++){
      const res = await w.createChatCompletion({messages: msgs, max_tokens: 200, temperature: 0.2});
      const out = (res.choices[0].message.content || '').trim();
      const t = parseTool(out);
      if(t && tools[t.tool]){
        const r = runTool(t.tool, t.args);
        add('tool', '🔧 ' + t.tool + ' → ' + r);
        msgs.push({role:'assistant', content: out});
        msgs.push({role:'user', content: 'Tool result: ' + r + '\nNow answer the user briefly in plain text.'});
        continue;
      }
      offHist.push({role:'user', content: text}, {role:'assistant', content: out});
      return out || '(khali jawab)';
    }
    return 'Offline model tool ke baad jawab nahi de paya.';
  }finally{ wait.remove(); }
}

/* ---------- Router ---------- */
async function route(text){
  const mode = store.get('mode', 'auto');
  const online = navigator.onLine;
  if(mode === 'offline' || (mode === 'auto' && !online)){
    return {text: await offlineAgent(text), tag: ' (offline)'};
  }
  if(!online) throw new Error('Internet nahi hai. ⚙ mein mode "Auto" ya "Sirf offline" karo.');
  try{
    return {text: await onlineAgent(text), tag: ''};
  }catch(e){
    if(mode === 'auto' && e.net && store.get('offlineReady', '')){
      add('tool', 'ℹ️ Online nahi chala, offline model try kar raha hoon');
      return {text: await offlineAgent(text), tag: ' (offline)'};
    }
    throw e;
  }
}

/* ---------- Events ---------- */
$('#f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const text = $('#inp').value.trim();
  if(!text) return;
  $('#inp').value = '';
  add('user', text);
  $('#send').disabled = true;
  const wait = add('tool', '... soch raha hoon');
  try{ const r = await route(text); wait.remove(); add('bot', r.text + r.tag); }
  catch(e){ wait.remove(); add('err', 'Error: ' + e.message); }
  $('#send').disabled = false;
});

function offState(){
  $('#offState').textContent = store.get('offlineReady', '')
    ? '✅ Offline model phone mein save hai.'
    : 'Abhi download nahi hua (~400 MB, WiFi par karo).';
}
$('#setBtn').onclick = () => {
  $('#mode2').value = store.get('mode', 'auto');
  $('#key').value = store.get('key', '');
  $('#model').value = store.get('model', DEF.model);
  $('#repo').value = store.get('repo', DEF.repo);
  $('#file').value = store.get('file', DEF.file);
  offState();
  $('#dlg').showModal();
};
function saveSettings(){
  store.set('mode', $('#mode2').value);
  store.set('key', $('#key').value.trim());
  store.set('model', $('#model').value.trim() || DEF.model);
  store.set('repo', $('#repo').value.trim() || DEF.repo);
  store.set('file', $('#file').value.trim() || DEF.file);
  chips();
}
$('#saveBtn').onclick = () => { saveSettings(); $('#dlg').close(); };
$('#clearChat').onclick = () => { history = []; offHist = []; $('#chat').innerHTML = ''; $('#dlg').close(); };

$('#dl').onclick = async () => {
  saveSettings();
  if(!navigator.onLine){ $('#progTxt').textContent = 'Internet chahiye download ke liye.'; return; }
  $('#dl').disabled = true;
  $('#prog').style.display = 'block'; $('#bar').style.width = '0';
  $('#progTxt').textContent = 'Library load ho rahi hai...';
  try{
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    await loadOffline((loaded, total) => {
      const pct = total ? Math.round(loaded / total * 100) : 0;
      $('#bar').style.width = pct + '%';
      $('#progTxt').textContent = 'Download: ' + pct + '% (' + Math.round(loaded / 1048576) + ' / ' + Math.round(total / 1048576) + ' MB)';
    });
    $('#progTxt').textContent = '✅ Ho gaya! Ab airplane mode mein test kar sakte ho.';
  }catch(e){
    $('#progTxt').textContent = '❌ Error: ' + e.message;
  }
  $('#dl').disabled = false; offState();
};

if('serviceWorker' in navigator){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

add('bot', 'Namaste! ⚙ dabao aur Gemini API key daalo. Phir mujhse kuch bhi poocho, jaise "25*4 kitna hota hai?" ya "note likho: kal 8 baje meeting".');
</script>
</body>
</html>
